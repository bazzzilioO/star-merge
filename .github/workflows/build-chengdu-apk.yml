name: Build Chengdu APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-apk' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore source archive
        run: |
          cat chengdu-chunks/part-* | base64 --decode > /tmp/chengdu-2026-source.tgz
          mkdir chengdu-2026
          tar -xzf /tmp/chengdu-2026-source.tgz -C chengdu-2026
      - name: Build debug APK
        run: gradle -p chengdu-2026 :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chengdu-2026-apk
          path: chengdu-2026/app/build/outputs/apk/debug/app-debug.apk
