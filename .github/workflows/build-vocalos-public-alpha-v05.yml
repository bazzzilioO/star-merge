name: Build Vocal OS Public Alpha 0.5

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'vocalos-public-alpha-v05-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore verified 0.4 base
        run: |
          cat vocalos-v04-b64/0* | tr -d '\n\r' | base64 --decode > Vocal-OS-public-alpha-0.4-source.tar.gz
          echo "264879577493f6310b00db8c91f984597a6c7ee09515c9dae0e7838db4eab235  Vocal-OS-public-alpha-0.4-source.tar.gz" | sha256sum -c -
          tar -xzf Vocal-OS-public-alpha-0.4-source.tar.gz

      - name: Apply and verify 0.5 adaptive core
        run: |
          cat v05-index-b64/0a v05-index-b64/0b v05-index-b64/0c v05-index-b64/0d v05-index-b64/1 v05-index-b64/2 v05-index-b64/3 | tr -d '\n\r' | base64 --decode > /tmp/index.html.gz
          gunzip -c /tmp/index.html.gz > vocalos-public-alpha-v04/app/src/main/assets/index.html
          echo "8b0151a5dd60f308f980a8aff6b740d897fed0ec1a537724fa92461b13983865  vocalos-public-alpha-v04/app/src/main/assets/index.html" | sha256sum -c -
          sed -i "s/versionCode 4/versionCode 5/" vocalos-public-alpha-v04/app/build.gradle
          sed -i "s/versionName '1.0.0-alpha04'/versionName '0.5-public-alpha'/" vocalos-public-alpha-v04/app/build.gradle
          ROOT=vocalos-public-alpha-v04
          test "$(grep -RIl 'ARKA\|com.arka' "$ROOT" | wc -l)" = "0"
          grep -q "targetSdk 36" "$ROOT/app/build.gradle"
          grep -q "versionCode 5" "$ROOT/app/build.gradle"
          grep -q "0.5-public-alpha" "$ROOT/app/build.gradle"
          grep -q "PUBLIC ALPHA · 0.5 · ADAPTIVE CORE" "$ROOT/app/src/main/assets/index.html"
          grep -q "placementOverlay" "$ROOT/app/src/main/assets/index.html"
          grep -q "placementCompleted" "$ROOT/app/src/main/assets/index.html"
          grep -q "recordPerformance" "$ROOT/app/src/main/assets/index.html"
          grep -q "startExercise" "$ROOT/app/src/main/assets/index.html"
          grep -q "adaptiveBpm" "$ROOT/app/src/main/assets/index.html"
          grep -q "exerciseMastery" "$ROOT/app/src/main/assets/index.html"
          grep -q "skillEstimate" "$ROOT/app/src/main/assets/index.html"
          ! grep -q "comfortLow:48.*comfortHigh:72" "$ROOT/app/src/main/assets/index.html"

      - name: Static UI QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import re, subprocess, tempfile
          root=Path('vocalos-public-alpha-v04')
          for p in root.rglob('*.xml'):
              ET.parse(p)
          html=(root/'app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', html, re.S|re.I)
          assert scripts
          for i,s in enumerate(scripts):
              f=Path(tempfile.gettempdir())/f'vocalos05-{i}.js'
              f.write_text(s, encoding='utf-8')
              subprocess.run(['node','--check',str(f)], check=True)
          ids=re.findall(r'\bid=["\']([^"\']+)["\']', html)
          assert len(ids)==len(set(ids)), 'duplicate DOM ids'
          for expected in ['placementOverlay','trainerCanvas','settingsModal','accuracyChoices']:
              assert expected in ids, expected
          assert html.count('data-ex-start=') == 54, html.count('data-ex-start=')
          assert '3 устойчивых результата' in html
          assert '2 слабых результата' in html
          print('Static UI QA OK:', len(scripts), 'scripts,', len(ids), 'unique ids, 54 executable exercises')
          PY

      - name: Build API 36 APK and AAB
        run: gradle -p vocalos-public-alpha-v04 :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Artifact smoke checks
        run: |
          APK=vocalos-public-alpha-v04/app/build/outputs/apk/debug/app-debug.apk
          AAB=vocalos-public-alpha-v04/app/build/outputs/bundle/debug/app-debug.aab
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -q AndroidManifest.xml
          unzip -l "$APK" | grep -q classes.dex
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          unzip -l "$AAB" | grep -q 'base/dex/classes.dex'
          sha256sum "$APK" "$AAB"

      - name: Upload 0.5 APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Vocal-OS-public-alpha-0.5
          path: |
            vocalos-public-alpha-v04/app/build/outputs/apk/debug/app-debug.apk
            vocalos-public-alpha-v04/app/build/outputs/bundle/debug/app-debug.aab
