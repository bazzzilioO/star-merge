name: Build Chengdu v0.6.8

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v068-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore verified v0.6.7 source
        run: |
          git fetch origin 57662a1d40d4cb243d6103563537c4fcdfc512fb --depth=1
          git checkout 57662a1d40d4cb243d6103563537c4fcdfc512fb -- .ci/chengdu-v067
          git show 57662a1d40d4cb243d6103563537c4fcdfc512fb:.github/workflows/build-chengdu-v067.yml > /tmp/v067.yml
          ruby -ryaml -e '
            doc = YAML.load_file("/tmp/v067.yml")
            doc.fetch("jobs").fetch("build").fetch("steps").select { |s| s["run"] }.first(2).each do |step|
              puts "\n# ---- #{step["name"] || "run"} ----"
              puts step["run"]
            end
          ' > /tmp/rebuild-v067-source.sh
          bash -euxo pipefail /tmp/rebuild-v067-source.sh
          test -f /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q "const APP_VERSION = '0.6.7';" /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q 'versionCode = 21' /tmp/chengdu-v062/project/app/build.gradle.kts
          grep -q 'versionName = "0.6.7"' /tmp/chengdu-v062/project/app/build.gradle.kts
          test -f /tmp/chengdu-v062/project/app/src/main/assets/v066.js
          echo 'ed906c9974287f2cba844d9222d5e0886a01f041c436df9c82e29f8bc639d4c0  /tmp/chengdu-v062/project/app/src/main/assets/trip-data.js' | sha256sum -c -
          echo '587aae871e10f4ef110a218195322fed58fdd895e1d7b93f098a518b07bdf112  /tmp/chengdu-v062/project/app/src/main/assets/guide-data.js' | sha256sum -c -
          echo '415407527c2de9b9ec8f764bff2de850fa7fc66356530d3bf2165c2e59e94cf5  /tmp/chengdu-v062/project/app/src/main/assets/phrase-data.js' | sha256sum -c -

      - name: Apply v0.6.8 cleanup
        run: |
          echo '6c7462e8ee7c9b36726660aa6cd28ba5e1a33fa7493dd593b67f95661b5c4539  .ci/chengdu-v068/v068.js' | sha256sum -c -
          cp .ci/chengdu-v068/v068.js /tmp/chengdu-v062/project/app/src/main/assets/v068.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/chengdu-v062/project')
          assets=root/'app/src/main/assets'
          app=assets/'app.js'; gradle=root/'app/build.gradle.kts'; idx=assets/'index.html'
          text=app.read_text(); assert text.count("const APP_VERSION = '0.6.7';") == 1
          app.write_text(text.replace("const APP_VERSION = '0.6.7';", "const APP_VERSION = '0.6.8';"))
          text=gradle.read_text(); assert text.count('versionCode = 21') == 1; assert text.count('versionName = "0.6.7"') == 1
          gradle.write_text(text.replace('versionCode = 21','versionCode = 22').replace('versionName = "0.6.7"','versionName = "0.6.8"'))
          text=idx.read_text()
          text=text.replace('  <link rel="stylesheet" href="v064.css">\n','')
          text=text.replace('  <script src="cost-data.js"></script>\n','')
          text=text.replace('  <script src="v064.js"></script>\n','')
          assert 'v068.js' not in text
          text=text.replace('  <script src="v066.js"></script>','  <script src="v066.js"></script>\n  <script src="v068.js"></script>')
          idx.write_text(text)
          for name in ['cost-data.js','v064.js','v064.css']:
            p=assets/name
            if p.exists(): p.unlink()
          PY
          node --check /tmp/chengdu-v062/project/app/src/main/assets/app.js
          node --check /tmp/chengdu-v062/project/app/src/main/assets/v068.js
          grep -q "const APP_VERSION = '0.6.8';" /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q 'versionCode = 22' /tmp/chengdu-v062/project/app/build.gradle.kts
          grep -q 'versionName = "0.6.8"' /tmp/chengdu-v062/project/app/build.gradle.kts
          grep -q 'v068.js' /tmp/chengdu-v062/project/app/src/main/assets/index.html
          ! grep -q 'v064.js\|v064.css\|cost-data.js' /tmp/chengdu-v062/project/app/src/main/assets/index.html
          test ! -e /tmp/chengdu-v062/project/app/src/main/assets/cost-data.js
          test ! -e /tmp/chengdu-v062/project/app/src/main/assets/v064.js
          test ! -e /tmp/chengdu-v062/project/app/src/main/assets/v064.css
          echo 'ed906c9974287f2cba844d9222d5e0886a01f041c436df9c82e29f8bc639d4c0  /tmp/chengdu-v062/project/app/src/main/assets/trip-data.js' | sha256sum -c -
          echo '587aae871e10f4ef110a218195322fed58fdd895e1d7b93f098a518b07bdf112  /tmp/chengdu-v062/project/app/src/main/assets/guide-data.js' | sha256sum -c -
          echo '415407527c2de9b9ec8f764bff2de850fa7fc66356530d3bf2165c2e59e94cf5  /tmp/chengdu-v062/project/app/src/main/assets/phrase-data.js' | sha256sum -c -
          if find /tmp/chengdu-v062/project -type f \( -iname '*.jks' -o -iname 'SIGNING.txt' \) | grep -q .; then
            echo 'Signing material must not be present in CI source' >&2
            exit 1
          fi

      - name: Build unsigned v0.6.8
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' -type f -print -quit)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p /tmp/chengdu-v062/project clean :app:assembleRelease --stacktrace

      - name: Collect unsigned APK and exact signing tools
        run: |
          rm -rf /tmp/dist-v068
          mkdir -p /tmp/dist-v068/signing-tools/lib /tmp/dist-v068/signing-tools/lib64 /tmp/dist-v068/project
          cp /tmp/chengdu-v062/project/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/dist-v068/
          BT="$ANDROID_HOME/build-tools/35.0.0"
          cp "$BT/zipalign" /tmp/dist-v068/signing-tools/
          cp "$BT/apksigner" /tmp/dist-v068/signing-tools/
          cp "$BT/aapt2" /tmp/dist-v068/signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/dist-v068/signing-tools/lib/
          if [ -f "$BT/lib64/libc++.so" ]; then cp "$BT/lib64/libc++.so" /tmp/dist-v068/signing-tools/lib64/; fi
          cp -a /tmp/chengdu-v062/project/. /tmp/dist-v068/project/
          sha256sum /tmp/dist-v068/app-release-unsigned.apk > /tmp/dist-v068/unsigned-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chengdu-v068-build
          path: /tmp/dist-v068
