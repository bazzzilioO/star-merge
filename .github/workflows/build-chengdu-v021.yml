name: Build Chengdu v0.2.1 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore source and signing key
        run: |
          find chengdu-v02-chunks -type f -name 'part-*' -print0 | sort -zV | xargs -0 cat | base64 --decode > /tmp/chengdu-v02-source.tgz
          mkdir chengdu-v02
          tar -xzf /tmp/chengdu-v02-source.tgz -C chengdu-v02
          base64 --decode chengdu-v02-signing/chengdu-release.jks.b64 > /tmp/chengdu-release.jks
          sed -i 's/versionCode = 2/versionCode = 3/' chengdu-v02/app/build.gradle.kts
          sed -i 's/versionName = "0.2.0"/versionName = "0.2.1"/' chengdu-v02/app/build.gradle.kts

      - name: Build unsigned release APK
        run: gradle -p chengdu-v02 :app:assembleRelease --stacktrace

      - name: Align and sign with APK Signature Scheme v2/v3
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          echo "Using Android build tools: $BT"
          "$BT/zipalign" -P 16 -f -v 4 chengdu-v02/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/Chengdu-2026-v0.2.1-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/chengdu-release.jks \
            --ks-key-alias chengdu \
            --ks-pass pass:Chengdu2026! \
            --key-pass pass:Chengdu2026! \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out /tmp/Chengdu-2026-v0.2.1.apk \
            /tmp/Chengdu-2026-v0.2.1-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/Chengdu-2026-v0.2.1.apk
          "$BT/zipalign" -c -P 16 -v 4 /tmp/Chengdu-2026-v0.2.1.apk

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: Chengdu-2026-v0.2.1-fixed
          path: /tmp/Chengdu-2026-v0.2.1.apk
