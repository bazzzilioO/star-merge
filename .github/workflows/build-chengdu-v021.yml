name: Export Android APK signing tools

on:
  pull_request:
    branches: [main]

jobs:
  export-tools:
    if: github.head_ref == 'chengdu-2026-v02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Android signing tools
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          mkdir -p /tmp/android-signing-tools/lib
          cp "$BT/zipalign" /tmp/android-signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/android-signing-tools/lib/
          printf '#!/usr/bin/env bash\nexec java -jar "$(dirname "$0")/lib/apksigner.jar" "$@"\n' > /tmp/android-signing-tools/apksigner
          chmod +x /tmp/android-signing-tools/apksigner /tmp/android-signing-tools/zipalign
          ldd /tmp/android-signing-tools/zipalign || true
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools
          path: /tmp/android-signing-tools
