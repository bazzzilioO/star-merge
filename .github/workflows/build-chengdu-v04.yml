name: Build Chengdu v0.4 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v04-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore source
        run: |
          find chengdu-v04-chunks -type f -name 'part-*' -print0 | sort -zV | xargs -0 cat | base64 --decode > /tmp/chengdu-v04-source.tgz
          mkdir chengdu-v04
          tar -xzf /tmp/chengdu-v04-source.tgz -C chengdu-v04

      - name: Build unsigned release APK
        run: gradle -p chengdu-v04 :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: chengdu-v04-unsigned
          path: chengdu-v04/app/build/outputs/apk/release/app-release-unsigned.apk
