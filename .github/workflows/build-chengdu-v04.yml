name: Build Chengdu v0.4 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v04-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('chengdu-v04-chunks/part-10-00')
          data = p.read_bytes()
          target = '44bf0e90663a19f2c6a3d5f39adeab545d3cae86aeedf59cb3a0d8b6f58cb442'
          if hashlib.sha256(data).hexdigest() != target:
              alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              found = None
              for pos in range(len(data) + 1):
                  prefix, suffix = data[:pos], data[pos:]
                  for ch in alphabet:
                      candidate = prefix + bytes([ch]) + suffix
                      if hashlib.sha256(candidate).hexdigest() == target:
                          found = candidate
                          print('Recovered missing base64 byte at', pos, chr(ch))
                          break
                  if found is not None:
                      break
              if found is None:
                  raise SystemExit('Could not recover truncated archive chunk')
              p.write_bytes(found)
          print('part-10-00', len(p.read_bytes()), hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          wc -c chengdu-v04-chunks/part-* || true
          find chengdu-v04-chunks -type f -name 'part-*' -print0 | sort -zV | xargs -0 cat | tr -d '\n\r\t ' > /tmp/chengdu-v04-source.b64
          test "$(wc -c < /tmp/chengdu-v04-source.b64)" = "128544"
          echo "d0cddc4994fbef7867432d10e53ed6dd8cd2ab736625f3a22f2d35b3808a753e  /tmp/chengdu-v04-source.b64" | sha256sum -c -
          base64 --decode /tmp/chengdu-v04-source.b64 > /tmp/chengdu-v04-source.tgz
          mkdir chengdu-v04
          tar -xzf /tmp/chengdu-v04-source.tgz -C chengdu-v04

      - name: Build unsigned release APK
        run: gradle -p chengdu-v04 :app:assembleRelease --stacktrace

      - name: Collect Android signing tools
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          mkdir -p /tmp/android-signing-tools/lib
          cp "$BT/zipalign" /tmp/android-signing-tools/
          cp "$BT/apksigner" /tmp/android-signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/android-signing-tools/lib/
          LIBCPP="$(find "$ANDROID_HOME" -name 'libc++.so' -type f | head -n1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" /tmp/android-signing-tools/
          echo "Build tools: $BT"
          echo "libc++: $LIBCPP"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: chengdu-v04-unsigned
          path: chengdu-v04/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-v04
          path: /tmp/android-signing-tools
