name: Build Chengdu v0.4 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v04-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore source
        run: |
          wc -c chengdu-v04-chunks/part-* || true
          find chengdu-v04-chunks -type f -name 'part-*' -print0 | sort -zV | xargs -0 cat | tr -d '\n\r\t ' > /tmp/chengdu-v04-source.b64
          wc -c /tmp/chengdu-v04-source.b64
          sha256sum /tmp/chengdu-v04-source.b64
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/chengdu-v04-source.b64').read_bytes()
          allowed=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          bad=[(i,x) for i,x in enumerate(b) if x not in allowed]
          print('length_mod_4',len(b)%4,'bad_chars',bad[:20])
          PY
          base64 --decode /tmp/chengdu-v04-source.b64 > /tmp/chengdu-v04-source.tgz
          mkdir chengdu-v04
          tar -xzf /tmp/chengdu-v04-source.tgz -C chengdu-v04

      - name: Build unsigned release APK
        run: gradle -p chengdu-v04 :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: chengdu-v04-unsigned
          path: chengdu-v04/app/build/outputs/apk/release/app-release-unsigned.apk
