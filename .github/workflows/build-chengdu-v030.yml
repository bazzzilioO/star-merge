name: Build Chengdu v0.3.0 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v03-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore source and signing key
        run: |
          find chengdu-v03-chunks -type f -name 'part-*' -print0 | sort -zV | xargs -0 cat | base64 --decode > /tmp/chengdu-v03-source.tgz
          echo "0755eebc04d522d5ef5baf208621c521d8bc1069e776f28bd73463ad87889f17  /tmp/chengdu-v03-source.tgz" | sha256sum -c -
          mkdir chengdu-v03
          tar -xzf /tmp/chengdu-v03-source.tgz -C chengdu-v03
          base64 --decode chengdu-v03-signing/chengdu-release.jks.b64 > /tmp/chengdu-release.jks
          echo "0cf3dcfc2be3208a53d6f57c7de75d52a4d213923ae579da8f51deb2a38e8278  /tmp/chengdu-release.jks" | sha256sum -c -

      - name: Build unsigned release APK
        run: gradle -p chengdu-v03 :app:assembleRelease --stacktrace

      - name: Align, sign and verify
        run: |
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/zipalign" -P 16 -f -v 4 chengdu-v03/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/Chengdu-2026-v0.3.0-aligned.apk
          "$BT/apksigner" sign \
            --ks /tmp/chengdu-release.jks \
            --ks-key-alias chengdu \
            --ks-pass pass:C26-UgmRwJsMDaDdKLBAcbis7E5k \
            --key-pass pass:C26-UgmRwJsMDaDdKLBAcbis7E5k \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out /tmp/Chengdu-2026-v0.3.0.apk \
            /tmp/Chengdu-2026-v0.3.0-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs /tmp/Chengdu-2026-v0.3.0.apk
          "$BT/zipalign" -c -P 16 -v 4 /tmp/Chengdu-2026-v0.3.0.apk
          sha256sum /tmp/Chengdu-2026-v0.3.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Chengdu-2026-v0.3.0
          path: /tmp/Chengdu-2026-v0.3.0.apk
