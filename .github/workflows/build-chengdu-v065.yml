name: Build Chengdu v0.6.5

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v065-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore verified v0.6.4 source
        run: |
          git fetch origin 249196b7dc7e85d115d6af8e885ff41b71fce498 --depth=1
          git show 249196b7dc7e85d115d6af8e885ff41b71fce498:.github/workflows/build-chengdu-v064.yml > /tmp/v064.yml
          ruby -ryaml -e '
            doc = YAML.load_file("/tmp/v064.yml")
            doc.fetch("jobs").fetch("build").fetch("steps").select { |s| s["run"] }.first(2).each do |step|
              puts "\n# ---- #{step["name"] || "run"} ----"
              puts step["run"]
            end
          ' > /tmp/rebuild-v064-source.sh
          bash -euxo pipefail /tmp/rebuild-v064-source.sh
          test -f /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q "const APP_VERSION = '0.6.4';" /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q 'versionCode = 18' /tmp/chengdu-v062/project/app/build.gradle.kts
          grep -q 'versionName = "0.6.4"' /tmp/chengdu-v062/project/app/build.gradle.kts
          test -f /tmp/chengdu-v062/project/app/src/main/assets/v064.js
          test -f /tmp/chengdu-v062/project/app/src/main/assets/v064.css
          echo 'ed906c9974287f2cba844d9222d5e0886a01f041c436df9c82e29f8bc639d4c0  /tmp/chengdu-v062/project/app/src/main/assets/trip-data.js' | sha256sum -c -
          echo '587aae871e10f4ef110a218195322fed58fdd895e1d7b93f098a518b07bdf112  /tmp/chengdu-v062/project/app/src/main/assets/guide-data.js' | sha256sum -c -
          echo '415407527c2de9b9ec8f764bff2de850fa7fc66356530d3bf2165c2e59e94cf5  /tmp/chengdu-v062/project/app/src/main/assets/phrase-data.js' | sha256sum -c -

      - name: Apply v0.6.5 information architecture cleanup
        run: |
          echo '89c0488e25bb95781359bbe852d2003bfd1ef15a04bf7f156162f5a7a0f05b6d  .ci/chengdu-v065/v065.js.part-00' | sha256sum -c -
          echo '0fe6f06ede79f5db4b5fae420c1617a72c1c62163cdbfbeac6eca149d396c10b  .ci/chengdu-v065/v065.js.part-01' | sha256sum -c -
          echo '31f8ca50854cc1cc8b430eeb8c7199bf031f8a055beb2349714deb0e60aa94ff  .ci/chengdu-v065/v065.js.part-02' | sha256sum -c -
          echo '9cc498e0d1d3276ee078d9cf5bec3bb01eef36543b5585838fa07bfc91546150  .ci/chengdu-v065/v065.css' | sha256sum -c -
          cat .ci/chengdu-v065/v065.js.part-* > /tmp/chengdu-v062/project/app/src/main/assets/v065.js
          cp .ci/chengdu-v065/v065.css /tmp/chengdu-v062/project/app/src/main/assets/v065.css
          echo '125515385b9b11118b6bd13e5d924d4e6d907f2b39ab768db28d8b7e25f8e935  /tmp/chengdu-v062/project/app/src/main/assets/v065.js' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/chengdu-v062/project')
          app=root/'app/src/main/assets/app.js'
          idx=root/'app/src/main/assets/index.html'
          gradle=root/'app/build.gradle.kts'
          text=app.read_text(); assert text.count("const APP_VERSION = '0.6.4';") == 1
          app.write_text(text.replace("const APP_VERSION = '0.6.4';", "const APP_VERSION = '0.6.5';"))
          text=gradle.read_text(); assert text.count('versionCode = 18') == 1; assert text.count('versionName = "0.6.4"') == 1
          gradle.write_text(text.replace('versionCode = 18','versionCode = 19').replace('versionName = "0.6.4"','versionName = "0.6.5"'))
          text=idx.read_text()
          style='<link rel="stylesheet" href="v064.css">'; assert text.count(style) == 1
          text=text.replace(style, style+'\n  <link rel="stylesheet" href="v065.css">')
          runtime='<script src="v064.js"></script>'; assert text.count(runtime) == 1
          text=text.replace(runtime, runtime+'\n  <script src="v065.js"></script>')
          idx.write_text(text)
          PY
          node --check /tmp/chengdu-v062/project/app/src/main/assets/app.js
          node --check /tmp/chengdu-v062/project/app/src/main/assets/v065.js
          grep -q "const APP_VERSION = '0.6.5';" /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q 'versionCode = 19' /tmp/chengdu-v062/project/app/build.gradle.kts
          grep -q 'versionName = "0.6.5"' /tmp/chengdu-v062/project/app/build.gradle.kts
          echo 'ed906c9974287f2cba844d9222d5e0886a01f041c436df9c82e29f8bc639d4c0  /tmp/chengdu-v062/project/app/src/main/assets/trip-data.js' | sha256sum -c -
          echo '587aae871e10f4ef110a218195322fed58fdd895e1d7b93f098a518b07bdf112  /tmp/chengdu-v062/project/app/src/main/assets/guide-data.js' | sha256sum -c -
          echo '415407527c2de9b9ec8f764bff2de850fa7fc66356530d3bf2165c2e59e94cf5  /tmp/chengdu-v062/project/app/src/main/assets/phrase-data.js' | sha256sum -c -
          if find /tmp/chengdu-v062/project -type f \( -iname '*.jks' -o -iname 'SIGNING.txt' \) | grep -q .; then
            echo 'Signing material must not be present in CI source' >&2
            exit 1
          fi

      - name: Build unsigned v0.6.5
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' -type f -print -quit)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p /tmp/chengdu-v062/project clean :app:assembleRelease --stacktrace

      - name: Collect unsigned APK and signing tools
        run: |
          rm -rf /tmp/dist-v065
          mkdir -p /tmp/dist-v065/signing-tools/lib /tmp/dist-v065/project
          cp /tmp/chengdu-v062/project/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/dist-v065/
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          cp "$BT/zipalign" /tmp/dist-v065/signing-tools/
          cp "$BT/apksigner" /tmp/dist-v065/signing-tools/
          cp "$BT/aapt2" /tmp/dist-v065/signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/dist-v065/signing-tools/lib/
          LIBCPP=$(find "$ANDROID_HOME" -name 'libc++.so' -type f -print -quit || true)
          if [ -n "$LIBCPP" ]; then cp "$LIBCPP" /tmp/dist-v065/signing-tools/; fi
          cp -a /tmp/chengdu-v062/project/. /tmp/dist-v065/project/
          sha256sum /tmp/dist-v065/app-release-unsigned.apk > /tmp/dist-v065/unsigned-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chengdu-v065-build
          path: /tmp/dist-v065
