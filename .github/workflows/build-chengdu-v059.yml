name: Build Chengdu v0.5.9

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v059-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore source
        run: |
          wc -c .ci/chengdu-v059/part-*
          sha256sum .ci/chengdu-v059/part-*
          cat .ci/chengdu-v059/part-* > /tmp/chengdu-v059-project.b64
          echo "combined bytes: $(wc -c < /tmp/chengdu-v059-project.b64)"
          sha256sum /tmp/chengdu-v059-project.b64
          base64 --decode /tmp/chengdu-v059-project.b64 > /tmp/chengdu-v059-project.tar.xz
          sha256sum /tmp/chengdu-v059-project.tar.xz
          xz -t /tmp/chengdu-v059-project.tar.xz
          mkdir -p /tmp/chengdu-v059
          tar -xJf /tmp/chengdu-v059-project.tar.xz -C /tmp/chengdu-v059

      - name: Ensure Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build unsigned release
        run: gradle -p /tmp/chengdu-v059/project clean :app:assembleRelease --stacktrace

      - name: Collect outputs and signing tools
        run: |
          mkdir -p /tmp/dist/signing-tools/lib
          cp /tmp/chengdu-v059/project/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/dist/
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          cp "$BT/zipalign" /tmp/dist/signing-tools/
          cp "$BT/apksigner" /tmp/dist/signing-tools/
          cp "$BT/aapt2" /tmp/dist/signing-tools/ || true
          cp "$BT/lib/apksigner.jar" /tmp/dist/signing-tools/lib/
          LIBCPP="$(find "$ANDROID_HOME" -name 'libc++.so' -type f | head -n1)"
          if [ -n "$LIBCPP" ]; then cp "$LIBCPP" /tmp/dist/signing-tools/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: chengdu-v059-build
          path: /tmp/dist
