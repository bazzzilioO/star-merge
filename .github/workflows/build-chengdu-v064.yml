name: Build Chengdu v0.6.4

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v064-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore verified v0.6.3 source
        run: |
          git fetch origin 80f48b33c3493166a2b744c70bca7add72f04728 --depth=1
          git checkout 80f48b33c3493166a2b744c70bca7add72f04728 -- .ci/chengdu-v063
          git show 80f48b33c3493166a2b744c70bca7add72f04728:.github/workflows/build-chengdu-v063.yml > /tmp/v063.yml
          ruby -ryaml -e '
            doc = YAML.load_file("/tmp/v063.yml")
            doc.fetch("jobs").fetch("build").fetch("steps").select { |s| s["run"] }.first(2).each do |step|
              puts "\n# ---- #{step["name"] || "run"} ----"
              puts step["run"]
            end
          ' > /tmp/rebuild-v063-source.sh
          bash -euxo pipefail /tmp/rebuild-v063-source.sh
          test -f /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q "const APP_VERSION = '0.6.3';" /tmp/chengdu-v062/project/app/src/main/assets/app.js
          grep -q 'versionCode = 17' /tmp/chengdu-v062/project/app/build.gradle.kts
          echo 'ed906c9974287f2cba844d9222d5e0886a01f041c436df9c82e29f8bc639d4c0  /tmp/chengdu-v062/project/app/src/main/assets/trip-data.js' | sha256sum -c -
          echo '587aae871e10f4ef110a218195322fed58fdd895e1d7b93f098a518b07bdf112  /tmp/chengdu-v062/project/app/src/main/assets/guide-data.js' | sha256sum -c -
          echo '415407527c2de9b9ec8f764bff2de850fa7fc66356530d3bf2165c2e59e94cf5  /tmp/chengdu-v062/project/app/src/main/assets/phrase-data.js' | sha256sum -c -

      - name: Apply v0.6.4 cost intelligence
        run: |
          base64 --decode .ci/chengdu-v064/cost-data.js.xz.b64 > /tmp/v064-cost.xz
          base64 --decode .ci/chengdu-v064/v064.js.xz.b64 > /tmp/v064-js.xz
          base64 --decode .ci/chengdu-v064/v064.css.xz.b64 > /tmp/v064-css.xz
          echo 'b39ed067801fdea1b519624456d28daaa93bfe0e42d79ebbb106fa789d865d98  /tmp/v064-cost.xz' | sha256sum -c -
          echo '9c1dcece52fd98c8f3ee5a7e4a91b42d40b364c79719846f0eb99bc74a577d11  /tmp/v064-js.xz' | sha256sum -c -
          echo '7d249766b4dff98d9e609779c8fbfbae4b344b22b5c0e55d233096f24d1e8f6b  /tmp/v064-css.xz' | sha256sum -c -
          xz -dc /tmp/v064-cost.xz > /tmp/chengdu-v062/project/app/src/main/assets/cost-data.js
          xz -dc /tmp/v064-js.xz > /tmp/chengdu-v062/project/app/src/main/assets/v064.js
          xz -dc /tmp/v064-css.xz > /tmp/chengdu-v062/project/app/src/main/assets/v064.css
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/chengdu-v062/project')
          app=root/'app/src/main/assets/app.js'
          idx=root/'app/src/main/assets/index.html'
          gradle=root/'app/build.gradle.kts'
          text=app.read_text(); assert text.count("const APP_VERSION = '0.6.3';") == 1
          app.write_text(text.replace("const APP_VERSION = '0.6.3';", "const APP_VERSION = '0.6.4';"))
          text=gradle.read_text(); assert text.count('versionCode = 17') == 1; assert text.count('versionName = "0.6.3"') == 1
          gradle.write_text(text.replace('versionCode = 17','versionCode = 18').replace('versionName = "0.6.3"','versionName = "0.6.4"'))
          text=idx.read_text(); style='<link rel="stylesheet" href="styles.css">'; assert text.count(style) == 1
          text=text.replace(style, style+'\n  <link rel="stylesheet" href="v064.css">')
          phrase='<script src="phrase-data.js"></script>'; assert text.count(phrase) == 1
          text=text.replace(phrase, phrase+'\n  <script src="cost-data.js"></script>')
          runtime='<script src="v060.js"></script>'; assert text.count(runtime) == 1
          text=text.replace(runtime, runtime+'\n  <script src="v064.js"></script>'); idx.write_text(text)
          PY
          node --check /tmp/chengdu-v062/project/app/src/main/assets/app.js
          node --check /tmp/chengdu-v062/project/app/src/main/assets/cost-data.js
          node --check /tmp/chengdu-v062/project/app/src/main/assets/v064.js
          echo '14bc8079735b5ac02cd8df62a5dfa71bc77274e6385006d9849e278c2bcbfc2a  /tmp/chengdu-v062/project/app/src/main/assets/app.js' | sha256sum -c -
          echo 'dac89a460de35cd23af1a7f9fe68090336b36105c6e543670932c807227413cd  /tmp/chengdu-v062/project/app/src/main/assets/index.html' | sha256sum -c -
          echo '375335434af7418c34f7e5d85ebdcb5be96fc7c3aa47e24aab841f4fc2eab591  /tmp/chengdu-v062/project/app/src/main/assets/cost-data.js' | sha256sum -c -
          echo '7cb877fe5b3bdd0168ffc7831cd493f2fd0a6445ea2dc6a8e6ba156cc40f883d  /tmp/chengdu-v062/project/app/src/main/assets/v064.js' | sha256sum -c -
          echo 'e00f5eb0b1a9158d04dcbb77aa983e67da79602653f5f96b77ebf0fd7a321f39  /tmp/chengdu-v062/project/app/src/main/assets/v064.css' | sha256sum -c -
          echo '8f07adfd1dbd2609ad89015d1d9f3673dbf497fc696bbf915d54772de5da8fa4  /tmp/chengdu-v062/project/app/build.gradle.kts' | sha256sum -c -
          if find /tmp/chengdu-v062/project -type f \( -iname '*.jks' -o -iname 'SIGNING.txt' \) | grep -q .; then exit 1; fi

      - name: Build unsigned v0.6.4
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' -type f -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p /tmp/chengdu-v062/project clean :app:assembleRelease --stacktrace

      - name: Collect unsigned APK and signing tools
        run: |
          rm -rf /tmp/dist-v064
          mkdir -p /tmp/dist-v064/signing-tools/lib /tmp/dist-v064/project-assets
          cp /tmp/chengdu-v062/project/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/dist-v064/
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          cp "$BT/zipalign" /tmp/dist-v064/signing-tools/
          cp "$BT/apksigner" /tmp/dist-v064/signing-tools/
          cp "$BT/aapt2" /tmp/dist-v064/signing-tools/
          cp "$BT/lib/apksigner.jar" /tmp/dist-v064/signing-tools/lib/
          python3 - <<'PY'
          from pathlib import Path
          found=list(Path('/usr/local/lib/android/sdk').rglob('libc++.so'))
          if found:
              out=Path('/tmp/dist-v064/signing-tools/lib64'); out.mkdir(parents=True,exist_ok=True); (out/'libc++.so').write_bytes(found[0].read_bytes())
          PY
          cp /tmp/chengdu-v062/project/app/src/main/assets/{app.js,index.html,cost-data.js,v064.js,v064.css,trip-data.js,guide-data.js,phrase-data.js} /tmp/dist-v064/project-assets/
          cp /tmp/chengdu-v062/project/app/build.gradle.kts /tmp/dist-v064/project-assets/
          sha256sum /tmp/dist-v064/app-release-unsigned.apk > /tmp/dist-v064/unsigned-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chengdu-v064-build
          path: /tmp/dist-v064
