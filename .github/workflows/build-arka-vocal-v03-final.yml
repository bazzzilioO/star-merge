name: Build ARKA Vocal v0.3 Final APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'arka-vocal-apk-v03-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify and restore source
        run: |
          echo "18162cd247a59262b50ba33b1dd9aa26436a3019a59391ba93b2de7f38924f8c  ARKA-Vocal-v0.3-source.tar.gz" | sha256sum -c -
          tar -xzf ARKA-Vocal-v0.3-source.tar.gz
      - name: Build installable debug APK
        run: gradle -p arka-vocal-app :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKA-Vocal-v0.3-debug
          path: arka-vocal-app/app/build/outputs/apk/debug/app-debug.apk
