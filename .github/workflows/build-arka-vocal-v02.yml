name: Build ARKA Vocal v0.2 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'arka-vocal-apk-v02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore verified source
        run: |
          cat arka-vocal-v02-repair/seg-* > /tmp/part-02-fixed
          test "$(wc -c < /tmp/part-02-fixed)" = "6000"
          echo "19334cb333ff60400e2a3ba2ba60683828d0958a8b88e6ae9169b763af6e531a  /tmp/part-02-fixed" | sha256sum -c -
          cp /tmp/part-02-fixed arka-vocal-v02-chunks/part-02
          find arka-vocal-v02-chunks -type f -name 'part-*' -print0 | sort -z | xargs -0 cat > /tmp/arka-vocal-v02-source.b64
          test "$(wc -c < /tmp/arka-vocal-v02-source.b64)" = "34980"
          echo "1d10523f7ced0a91596db4c87b003f904854f87981069636dcda9f4f7201dec7  /tmp/arka-vocal-v02-source.b64" | sha256sum -c -
          base64 --decode /tmp/arka-vocal-v02-source.b64 > /tmp/ARKA-Vocal-v0.2-source.tar.gz
          echo "3c0755997f46201929f20845c8839f6b8c897a923f207edb4d5572da301bfde7  /tmp/ARKA-Vocal-v0.2-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ARKA-Vocal-v0.2-source.tar.gz

      - name: Build installable debug APK
        run: gradle -p arka-vocal-app :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKA-Vocal-v0.2-debug
          path: arka-vocal-app/app/build/outputs/apk/debug/app-debug.apk
