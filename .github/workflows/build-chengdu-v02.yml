name: Build Chengdu v0.2 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v02'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore source
        run: |
          cat chengdu-v02-chunks/part-* | base64 --decode > /tmp/chengdu-v02-source.tgz
          echo "176e2c936a8c77dcc4810b53ce9dda90de85174c2e8ffff748b4a3aca8badb88  /tmp/chengdu-v02-source.tgz" | sha256sum -c -
          mkdir chengdu-v02
          tar -xzf /tmp/chengdu-v02-source.tgz -C chengdu-v02
      - name: Build unsigned release APK
        run: gradle -p chengdu-v02 :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chengdu-v02-unsigned
          path: chengdu-v02/app/build/outputs/apk/release/app-release-unsigned.apk
