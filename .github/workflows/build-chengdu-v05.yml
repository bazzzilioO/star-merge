name: Build Chengdu v0.5 APK

on:
  pull_request:
    branches: [main]

jobs:
  build:
    if: github.head_ref == 'chengdu-2026-v05-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore source
        run: |
          wc -c chengdu-v05-xz-chunks/part-* || true
          find chengdu-v05-xz-chunks -type f -name 'part-*' -print0 | sort -z | xargs -0 cat > /tmp/chengdu-v05-project.b64
          wc -c /tmp/chengdu-v05-project.b64
          sha256sum /tmp/chengdu-v05-project.b64
          echo "84f695b90124c329e4162e32327adcdc3247aea3128c85e4fe35e1adb95f0740  /tmp/chengdu-v05-project.b64" | sha256sum -c -
          base64 --decode /tmp/chengdu-v05-project.b64 > /tmp/chengdu-v05-project.tar.xz
          echo "3a131e57cd9a80a2a6c8ce585ca3853a6ac2f567b30490e14207f809c2234bd9  /tmp/chengdu-v05-project.tar.xz" | sha256sum -c -
          mkdir chengdu-v05
          tar -xJf /tmp/chengdu-v05-project.tar.xz -C chengdu-v05

      - name: Build unsigned release APK
        run: gradle -p chengdu-v05 :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: chengdu-v05-unsigned
          path: chengdu-v05/app/build/outputs/apk/release/app-release-unsigned.apk
